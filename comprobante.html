<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comprobante - Aroma y Café</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #faf3e7;
    color: #3e2723;
    padding: 40px;
}

.ticket {
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 0 15px rgba(0,0,0,.1);
}

h1, h2 {
    text-align: center;
}

.info {
    margin-bottom: 20px;
}

.encabezado,
.producto {
    display: flex;
    padding: 10px 5px;
    border-bottom: 1px solid #ddd;
}

.encabezado {
    background: #f0e1cc;
    font-weight: bold;
}

.col-producto {
    width: 40%;
}

.col-precio {
    width: 20%;
    text-align: center;
}

.col-cantidad {
    width: 20%;
    text-align: center;
}

.col-importe {
    width: 20%;
    text-align: right;
}

.total-desglose {
    text-align: right;
    margin-top: 15px;
    font-size: 16px;
    color: #38251e;
    line-height: 1.5;
}

.total-desglose span {
    font-size: 24px;
    font-weight: bold;
    display: block;
    color: #3e2723;
}

.gracias {
    text-align: center;
    color: green;
    margin-top: 25px;
    font-size: 20px;
    font-weight: bold;
}

.cabecera-ticket {
    background: linear-gradient(135deg, #e8c99b, #f4e2c7);
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    margin-bottom: 25px;
    border: 2px solid #d6b07f;
    box-shadow: 0 8px 20px rgba(111,69,48,.15);
}

.cabecera-ticket h1 {
    color: #6f4530;
    margin: 0;
    font-size: 42px;
    letter-spacing: 1px;
}

.cabecera-ticket h2 {
    color: #8b5e3c;
    margin-top: 10px;
    font-size: 28px;
    font-weight: normal;
}

.caja-envio, .caja-tiempo, .caja-notas {
    background: #fdf6ec;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    border: 1px solid #e7d4ba;
}

.caja-tiempo {
    background: #f4e2c7;
    text-align: center;
    font-size: 16px;
    color: #593724;
    font-weight: bold;
}

.caja-notas {
    border: 1px solid #d6b07f;
    font-size: 14px;
    color: #4b3024;
}

.btn-ver-imagen {
    display: inline-block;
    margin-top: 10px;
    background-color: #6f4530;
    color: white;
    padding: 8px 16px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    border: none;
}

.btn-ver-imagen:hover {
    background-color: #a76b3f;
}
</style>
</head>

<body>

<div class="ticket">

    <div class="cabecera-ticket">
        <h1>☕ Aroma y Café</h1>
        <h2 id="tituloTipoTicket">Comprobante de Compra</h2>
        <p id="turnoTicket" style="margin-top: 8px; font-weight: bold; color: #593724; font-size: 18px;"></p>
    </div>

    <div id="seccionEnvioContainer"></div>

    <div class="caja-tiempo" id="cajaTiempoEstimado"></div>

    <div class="info">
        <p id="folio"></p>
        <p id="fecha"></p>
    </div>

    <hr>

    <div class="encabezado">
        <div class="col-producto">Producto</div>
        <div class="col-precio">Precio Unitario</div>
        <div class="col-cantidad">Cantidad</div>
        <div class="col-importe">Importe</div>
    </div>

    <div id="productos"></div>

    <p id="articulos" style="margin-top: 15px;"></p>

    <!-- Apartado para mostrar notas o especificaciones -->
    <div id="seccionNotas"></div>

    <div class="total-desglose" id="contenedorTotales"></div>

    <hr>

    <p id="metodo"></p>

    <div id="datosPago"></div>

    <div class="gracias">
        ¡Gracias por tu compra!
    </div>

</div>

<script>
let folio = localStorage.getItem("folio");
if(!folio){
    folio = "CAF-" + Math.floor(100000 + Math.random() * 900000);
    localStorage.setItem("folio", folio);
}

document.getElementById("folio").innerHTML = "<b>Folio:</b> " + folio;

let fechaCompraStr = localStorage.getItem("fechaCompra") || new Date().toLocaleString();
document.getElementById("fecha").innerHTML = "<b>Fecha:</b> " + fechaCompraStr;

// Mostrar turno automático
let turnoActual = localStorage.getItem("turnoPedido") || "Matutino";
document.getElementById("turnoTicket").innerHTML = `☀️ Turno: ${turnoActual}`;

let productos = document.getElementById("productos");

function agregar(nombre, cantidad, precio){
    if(cantidad > 0){
        let importe = cantidad * precio;
        productos.innerHTML += `
        <div class="producto">
            <div class="col-producto">${nombre}</div>
            <div class="col-precio">$${precio}</div>
            <div class="col-cantidad">${cantidad}</div>
            <div class="col-importe">$${importe}</div>
        </div>
        `;
    }
}

let esp = parseInt(localStorage.getItem("espresso")) || 0;
let cap = parseInt(localStorage.getItem("capuchino")) || 0;
let cho = parseInt(localStorage.getItem("chocomilk")) || 0;
let pas = parseInt(localStorage.getItem("pastel")) || 0;
let bag = parseInt(localStorage.getItem("baguette")) || 0;

agregar("Café Espresso", esp, 50);
agregar("Capuchino", cap, 45);
agregar("Chocomilk", cho, 35);
agregar("Pastel de Chocolate", pas, 90);
agregar("Baguette", bag, 75);

let totalArticulos = esp + cap + cho + pas + bag;
document.getElementById("articulos").innerHTML = "<b>Total de artículos:</b> " + totalArticulos;

// Mostrar notas si el cliente escribió alguna
let notasCliente = localStorage.getItem("notasPedido") || "";
if (notasCliente.trim() !== "" && notasCliente !== "Sin observaciones") {
    document.getElementById("seccionNotas").innerHTML = `
        <div class="caja-notas">
            <p><b>📝 Notas / Especificaciones:</b> ${notasCliente}</p>
        </div>
    `;
}

let subtotalOriginal = parseFloat(localStorage.getItem("subtotalBase"));
if (isNaN(subtotalOriginal)) {
    let valorPrevio = parseFloat(localStorage.getItem("totalCompra")) || 0;
    subtotalOriginal = valorPrevio > 0 ? valorPrevio / 1.16 : 0;
}

let iva = subtotalOriginal * 0.16;
let totalConIva = subtotalOriginal + iva;

document.getElementById("contenedorTotales").innerHTML = `
    Subtotal: $${subtotalOriginal.toFixed(2)} MXN<br>
    IVA (16%): $${iva.toFixed(2)} MXN<br>
    <span>TOTAL: $${totalConIva.toFixed(2)} MXN</span>
`;

let tipoEntrega = localStorage.getItem("tipoEntrega") || "pickup";
let metodo = (localStorage.getItem("metodoPago") || "").toLowerCase();
let datosPago = document.getElementById("datosPago");
let tituloTicket = document.getElementById("tituloTipoTicket");
let seccionEnvio = document.getElementById("seccionEnvioContainer");
let cajaTiempo = document.getElementById("cajaTiempoEstimado");

let ahora = new Date();
let horaEntregaDelivery = new Date(ahora.getTime() + 40 * 60000);
let horaEntregaPickup = new Date(ahora.getTime() + 15 * 60000);

let formatoHoraDelivery = horaEntregaDelivery.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
let formatoHoraPickup = horaEntregaPickup.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

if (tipoEntrega === "delivery") {
    tituloTicket.innerText = "Comprobante de Delivery";
    let deliveryData = JSON.parse(localStorage.getItem("datosDelivery") || "{}");
    
    seccionEnvio.innerHTML = `
        <div class="caja-envio">
            <h3 style="color: #6f4530; margin-bottom: 8px;">🛵 Dirección de Envío a Domicilio</h3>
            <p><b>Recibe:</b> ${deliveryData.recibe || 'N/A'}</p>
            <p><b>Teléfono:</b> ${deliveryData.telefono || 'N/A'}</p>
            <p><b>Dirección:</b> ${deliveryData.direccion || 'N/A'}, Col. ${deliveryData.colonia || 'N/A'}, C.P. ${deliveryData.cp || 'N/A'}</p>
            ${deliveryData.referencias ? `<p><b>Referencias:</b> ${deliveryData.referencias}</p>` : ''}
        </div>
    `;

    cajaTiempo.innerHTML = `⏱️ Tiempo estimado de entrega: <b>30 - 45 minutos</b> (Aprox. a las ${formatoHoraDelivery})`;

    if (metodo.includes("efectivo")) {
        document.getElementById("metodo").innerHTML = "<b>Método de pago:</b> 💵 Efectivo (Pago al recibir)";
        
        let montoIngresadoStr = deliveryData.detallesPago || "0";
        let montoIngresado = parseFloat(montoIngresadoStr.replace(/[^0-9.]/g, '')) || totalConIva;
        let cambioCalculado = montoIngresado - totalConIva;
        if(cambioCalculado < 0) cambioCalculado = 0;

        datosPago.innerHTML = `
            <h3>Pago en Efectivo al Repartidor</h3>
            <p><b>Paga con:</b> $${montoIngresado.toFixed(2)} MXN</p>
            <p><b>Cambio estimado a entregar:</b> $${cambioCalculado.toFixed(2)} MXN</p>
        `;
    } else if (metodo.includes("tarjeta")) {
        document.getElementById("metodo").innerHTML = "<b>Método de pago:</b> 💳 Tarjeta (Terminal TPV al recibir)";
        datosPago.innerHTML = `
            <h3>Pago con Tarjeta a Domicilio</h3>
            <p>✅ El repartidor llevará una terminal electrónica (TPV) portátil hasta tu puerta para realizar el cobro con tarjeta de crédito o débito.</p>
        `;
    } else if (metodo.includes("transferencia")) {
        document.getElementById("metodo").innerHTML = "<b>Método de pago:</b> 🏦 Transferencia Bancaria";
        
        let imagenComprobanteB64 = localStorage.getItem("comprobanteImagen");
        let botonImagenHTML = "";
        
        if (imagenComprobanteB64) {
            botonImagenHTML = `<br><button class="btn-ver-imagen" onclick="abrirImagenComprobante()">🔍 Ver imagen de comprobante</button>`;
        } else {
            botonImagenHTML = `<p style="margin-top:5px; font-size:13px; color:#a0522d;"><i>No se adjuntó ninguna imagen del comprobante.</i></p>`;
        }

        datosPago.innerHTML = `
            <h3>Datos de la Transferencia del Cliente</h3>
            <p><b>Detalles del pago:</b> ${deliveryData.detallesPago || 'Sin detalles'}</p>
            ${botonImagenHTML}
        `;
    }

} else {
    tituloTicket.innerText = "Ticket de Recoger en Tienda (Pickup)";
    cajaTiempo.innerHTML = `⏱️ Tu pedido estará listo para recoger en tienda en aprox. <b>15 - 20 minutos</b> (Aprox. a las ${formatoHoraPickup})`;

    if(metodo.includes("efectivo")){
        document.getElementById("metodo").innerHTML = "<b>Método de pago:</b> 💵 Efectivo";
        datosPago.innerHTML = `
            <h3>Pago en efectivo (En Tienda)</h3>
            <p>Pago recibido correctamente en sucursal.</p>
        `;
    } else if(metodo.includes("tarjeta")){
        document.getElementById("metodo").innerHTML = "<b>Método de pago:</b> 💳 Tarjeta";
        let nombre = localStorage.getItem("nombreTitular") || "";
        let tarjeta = localStorage.getItem("numeroTarjeta") || "";
        let ultimos4 = tarjeta.length >= 4 ? tarjeta.slice(-4) : "0000";
        datosPago.innerHTML = `
            <h3>Datos de la Tarjeta</h3>
            <p><b>Titular:</b> ${nombre}</p>
            <p><b>Tarjeta:</b> **** **** **** ${ultimos4}</p>
        `;
    } else if(metodo.includes("transferencia")){
        document.getElementById("metodo").innerHTML = "<b>Método de pago:</b> 🏦 Transferencia Bancaria";
        let banco = localStorage.getItem("banco") || "";
        let referencia = localStorage.getItem("referencia") || "";
        
        let imagenComprobanteB64 = localStorage.getItem("comprobanteImagen");
        let botonImagenHTML = "";
        
        if (imagenComprobanteB64) {
            botonImagenHTML = `<br><button class="btn-ver-imagen" onclick="abrirImagenComprobante()">🔍 Ver imagen de comprobante</button>`;
        } else {
            botonImagenHTML = `<p style="margin-top:5px; font-size:13px; color:#a0522d;"><i>No se adjuntó ninguna imagen del comprobante.</i></p>`;
        }

        datosPago.innerHTML = `
            <h3>Datos de Transferencia</h3>
            <p><b>Banco:</b> ${banco}</p>
            <p><b>Referencia:</b> ${referencia}</p>
            ${botonImagenHTML}
        `;
    }
}

function abrirImagenComprobante() {
    let imagenB64 = localStorage.getItem("comprobanteImagen");
    if (imagenB64) {
        let ventana = window.open("");
        ventana.document.write(`<title>Comprobante de Transferencia</title><img src="${imagenB64}" style="max-width:100%; height:auto; display:block; margin:auto;"/>`);
    } else {
        alert("No se adjuntó ninguna imagen del comprobante.");
    }
}
</script>

</body>
</html>
